name: keepalive

on:
  schedule:
    # Monthly repository activity keeps scheduled workflows from being
    # disabled after 60 days of inactivity.
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record repository activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit -m 'chore: keep scheduled workflows active'
          git push
