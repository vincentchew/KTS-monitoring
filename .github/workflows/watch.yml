name: watch

on:
  schedule:
    # Every 15 minutes (UTC). GitHub does not guarantee exact timing.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kts-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: .state
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FROM_STATION: ${{ secrets.FROM_STATION }}
          TO_STATION: ${{ secrets.TO_STATION }}
          WATCH_DATES: ${{ secrets.WATCH_DATES }}
          RETURN_DATES: ${{ secrets.RETURN_DATES }}
          TIME_FILTER: ${{ secrets.TIME_FILTER }}
          RETURN_TIME_FILTER: ${{ secrets.RETURN_TIME_FILTER }}
          PASSENGER_COUNT: ${{ secrets.PASSENGER_COUNT }}
          STATE_PATH: .state/alerted.json
        run: python3 watch.py

      # Fires if checkout/setup/watcher fails (red job).
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing Telegram secrets; cannot notify"
            exit 0
          fi
          TEXT="$(printf '⚠️ KTS watcher failed\nOpen Actions: %s' "$RUN_URL")"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            | tee /tmp/tg.json
          python3 -c "import json,sys; d=json.load(open('/tmp/tg.json')); sys.exit(0 if d.get('ok') else 1)"
